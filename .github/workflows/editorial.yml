name: Editorial and reader workflow
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: editorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python brief.py examples/brief.json
  postgres:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: epstmc_test
          POSTGRES_USER: epstmc
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      EPSTMC_TEST_DATABASE_URL: postgresql://epstmc:local-ci-only@localhost:5432/epstmc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt
      - run: python -m unittest discover -s tests -v
